_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Human-readable project name.

project_slug:
  type: str
  help: Repository/package slug.
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-sentence project description.
  default: "A high-purity agentic application."

adoption_date:
  type: str
  help: Initial doctrine adoption date in YYYY-MM-DD format.
  default: "{{ '%Y-%m-%d' | strftime }}"

primary_domain:
  type: str
  help: Product or problem domain.
  default: "Agentic software"

frontend:
  type: str
  help: Preferred frontend layer for this project.
  choices:
    Elm: Elm
    TypeScript/React: TypeScript/React
    Other / undecided: Other / undecided
  default: Elm

backend:
  type: str
  help: Preferred backend domain core for this project.
  choices:
    Haskell: Haskell
    Rust: Rust
    TypeScript: TypeScript
    Other / undecided: Other / undecided
  default: Haskell

workflow_runtime:
  type: str
  help: Durable workflow runtime.
  choices:
    Temporal: Temporal
    None yet: None yet
    Other / undecided: Other / undecided
  default: Temporal

database:
  type: str
  help: Durable source of truth.
  choices:
    PostgreSQL: PostgreSQL
    Other / undecided: Other / undecided
  default: PostgreSQL

vector_store:
  type: str
  help: Retrieval/vector storage default.
  choices:
    PostgreSQL + pgvector: PostgreSQL + pgvector
    Qdrant: Qdrant
    None yet: None yet
    Other / undecided: Other / undecided
  default: PostgreSQL + pgvector

policy_engine:
  type: str
  help: Policy and authorization engine.
  choices:
    OPA / Rego: OPA / Rego
    Application policy module: Application policy module
    Other / undecided: Other / undecided
  default: OPA / Rego

cloud_target:
  type: str
  help: Initial cloud/deployment target.
  choices:
    AWS: AWS
    Cloudflare: Cloudflare
    Vercel: Vercel
    GCP: GCP
    Azure: Azure
    Undecided: Undecided
    Other: Other
  default: Undecided
