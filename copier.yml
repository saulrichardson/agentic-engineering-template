_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Human-readable project name.

project_slug:
  type: str
  help: Repository/package slug.
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-sentence project description.
  default: "A high-integrity software project developed with autonomous coding agents."

adoption_date:
  type: str
  help: Initial doctrine adoption date in YYYY-MM-DD format.
  default: "{{ '%Y-%m-%d' | strftime }}"

primary_domain:
  type: str
  help: Product or problem domain.
  default: "High-integrity software"

frontend:
  type: str
  help: Preferred frontend layer for this project, for example PureScript, Elm, TypeScript/React, or undecided.
  default: PureScript

backend:
  type: str
  help: Preferred backend domain core for this project, for example Haskell, Rust, TypeScript, or undecided.
  default: Haskell

workflow_runtime:
  type: str
  help: Durable workflow runtime, for example Temporal, none yet, or undecided.
  default: Temporal

database:
  type: str
  help: Durable source of truth, for example PostgreSQL or undecided.
  default: PostgreSQL

vector_store:
  type: str
  help: Retrieval/vector storage default, for example PostgreSQL + pgvector, Qdrant, none yet, or undecided.
  default: PostgreSQL + pgvector

policy_engine:
  type: str
  help: Policy and authorization engine, for example OPA / Rego, application policy module, or undecided.
  default: OPA / Rego

cloud_target:
  type: str
  help: Initial cloud/deployment target, for example AWS, Cloudflare, Vercel, GCP, Azure, or undecided.
  default: Undecided
